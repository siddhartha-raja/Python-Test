trigger:
- main

pool:
  name: 'Default'
  demands:
    - Agent.Name -equals chvuc21

variables:
  # Adjusted to use a literal home path since $(whoami) isn't a standard ADO variable
  # You can also use /home/ubuntu/deployed_flask_app if that is the user
  deployDirectory: '$(Pipeline.Workspace)/deployed_flask_app'

steps:
# 1. Security Check
- script: |
    if [ "$EUID" -eq 0 ]; then
      echo "Error: Running as root is not allowed."
      exit 1
    fi
  displayName: 'Verify Non-Root'

# 2. Install Test Dependencies Globally (User Space)
- script: |
    python3.10 -m pip install --user --upgrade pip
    python3.10 -m pip install --user pytest pytest-cov flask
  displayName: 'Install Test Dependencies'

# 3. Run Tests with Code Coverage (Directly via System Python)
- script: |
    # Adding ~/.local/bin to path in case pytest-cov needs it
    export PATH=$PATH:$HOME/.local/bin
    export PYTHONPATH=$PYTHONPATH:$(System.DefaultWorkingDirectory)
    python3.10 -m pytest tests/ --cov=. --cov-report=xml --junitxml=test-results.xml
  displayName: 'Run Tests and Coverage'
  continueOnError: true

# 4. Publish Results to Azure
- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFiles: '**/test-results.xml'
    testRunTitle: 'Python 3.10 Tests'

- task: PublishCodeCoverageResults@2
  inputs:
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
    pathToSources: '$(System.DefaultWorkingDirectory)'
  displayName: 'Publish Code Coverage'

# 5. Archive the App (Excluding test artifacts and local files)
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/flask_app.zip'
    replaceExistingArchive: true
  displayName: 'Zip Application'

# 6. Extract to Deployment Directory
- script: |
    mkdir -p $(deployDirectory)
    # Clear old files to ensure a clean 'prod-grade' update
    rm -rf $(deployDirectory)/*
    unzip -o $(Build.ArtifactStagingDirectory)/flask_app.zip -d $(deployDirectory)
  displayName: 'Extract to Deploy Directory'

# 7. Finalize and Restart Service
- script: |
    cd $(deployDirectory)
    # Setup/Update the deployment-specific venv
    python3.10 -m venv venv
    ./venv/bin/pip install --upgrade pip
    ./venv/bin/pip install -r requirements.txt
    
    # Restart the background service
    # Assuming the service name is 'flaskapp'
    
  displayName: 'Finalize and Restart Service'